name: sentinel-production
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sentinel}
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sentinel_admin -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  migrate:
    build: .
    image: ${IMAGE_REGISTRY_PREFIX:-}sentinel-api:${IMAGE_TAG:-local}
    command: [python, -m, api.migrate]
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${DATABASE_NAME:-sentinel}
      DATABASE_USER: ${DATABASE_USER:-sentinel_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
    security_opt: [no-new-privileges:true]
  api:
    build: .
    image: ${IMAGE_REGISTRY_PREFIX:-}sentinel-api:${IMAGE_TAG:-local}
    environment:
      ONTARIO_511_API_KEY: ${ONTARIO_511_API_KEY:?Set ONTARIO_511_API_KEY}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${DATABASE_NAME:-sentinel}
      DATABASE_USER: ${DATABASE_USER:-sentinel_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      SENTINEL_REQUESTS_PER_MINUTE: ${SENTINEL_REQUESTS_PER_MINUTE:-120}
      SENTINEL_ALLOWED_HOSTS: ${SENTINEL_ALLOWED_HOSTS:?Set SENTINEL_ALLOWED_HOSTS}
      SENTINEL_PUBLIC_DOCS: '0'
    networks: [database, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${IMAGE_REGISTRY_PREFIX:-}sentinel-web:${IMAGE_TAG:-local}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
networks:
  database: {internal: true}
  edge:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
